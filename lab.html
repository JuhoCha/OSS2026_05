<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name vewport contnet="width=device">
    <script>
        function clickMe() {
            const ClickBtn = document.querySelector("#ClickBtn");
            alert("1버튼이 클릭되었습니다.");
        }

        function add() {
            const num1 = document.querySelector("#num1").value;
            const num2 = document.querySelector("#num2").value;

            const result = Number(num1) + Number(num2);
            document.querySelector("#result").value = result;
        }

        const addBtn = document.getElementById("addBtn");

        window.addEventListener("load", function(){ //이게 원래 script는 body다 나오고 적용 시키려고 밑에 하는데 이거 있으면 안그래도 된다~
            const ClickBtn2 = document.querySelector("#ClickBtn2");
            ClickBtn2.addEventListener("click", function (event) {
            ClickBtn2.innerHTML = "<h1>2버튼이 클릭되었습니다.</h1>"
                 }
             )
        })
    </script>
</head>

<body>

    <!--클릭버튼 실습-->
    <h3>Internal JS</h3>
    <button id="ClickBtn2">Click Me!</button>

    <!--클릭버튼 실습-->
    <h3>Inline JS</h3>
    <button id="ClickBtn" onclick="clickMe()">Click Me!</button>

    <!--계산기-->
    <h2>덧셈 계산기</h2>
    <input id="num1" size="4">
    <input id="num2" size="4">
    <button id="addBtn" onclick="add()">+</button> <!--() ; 이런거 빼먹으며 ㄴ안된다..-->
    <input id="result">
</body>


</html>
